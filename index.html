<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline — Coastal Recruiting</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f4;
    --bg-tertiary: #eeece8;
    --bg-info: #e6f1fb;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-info: #185fa5;
    --border-light: rgba(0,0,0,0.12);
    --border-mid: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --bg-tertiary: #242426;
      --bg-info: #0c2a45;
      --text-primary: #f2f2f7;
      --text-secondary: #ababab;
      --text-info: #85b7eb;
      --border-light: rgba(255,255,255,0.1);
      --border-mid: rgba(255,255,255,0.2);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg-primary); border-bottom: 0.5px solid var(--border-light); flex-shrink: 0; flex-wrap: wrap; }
  #topbar-title { font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; margin-right: 4px; }
  #search-input { height: 30px; padding: 0 9px; font-size: 12px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-primary); width: 180px; }
  #search-input:focus { outline: none; border-color: var(--border-mid); }
  #filter-client { height: 30px; padding: 0 7px; font-size: 12px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-primary); }
  .tb-btn { height: 30px; padding: 0 12px; font-size: 12px; font-weight: 500; border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; white-space: nowrap; }
  .tb-btn:hover { background: var(--bg-secondary); }
  .tb-btn.accent { background: var(--bg-info); color: var(--text-info); }

  #summary-bar { display: flex; gap: 10px; padding: 8px 16px; background: var(--bg-primary); border-bottom: 0.5px solid var(--border-light); flex-shrink: 0; overflow-x: auto; }
  .s-card { display: flex; flex-direction: column; align-items: center; min-width: 90px; padding: 6px 10px; background: var(--bg-secondary); border-radius: var(--radius-md); border: 0.5px solid var(--border-light); }
  .s-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 2px; white-space: nowrap; }
  .s-val { font-size: 16px; font-weight: 500; color: var(--text-primary); }

  #board { display: flex; gap: 10px; padding: 12px; overflow-x: auto; overflow-y: hidden; flex: 1; }
  .column { display: flex; flex-direction: column; min-width: 210px; max-width: 210px; background: var(--bg-secondary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; }
  .col-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 0.5px solid var(--border-light); flex-shrink: 0; }
  .col-title-wrap { display: flex; align-items: center; gap: 6px; }
  .col-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .col-title { font-size: 11px; font-weight: 500; color: var(--text-primary); }
  .col-count { font-size: 10px; color: var(--text-secondary); background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: 10px; padding: 1px 5px; }
  .col-cards { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; min-height: 60px; }
  .col-cards.drag-over { background: var(--bg-info); }
  .card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-md); padding: 9px 10px; cursor: grab; transition: border-color 0.15s; }
  .card:hover { border-color: var(--border-mid); }
  .card.dragging { opacity: 0.35; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; margin-bottom: 3px; }
  .card-name { font-size: 12px; font-weight: 500; color: var(--text-primary); line-height: 1.3; }
  .card-menu-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 15px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .card-menu-btn:hover { color: var(--text-primary); }
  .card-role { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 3px; }
  .tag { font-size: 10px; padding: 2px 5px; border-radius: 4px; font-weight: 500; }
  .tag-client { background: var(--bg-info); color: var(--text-info); }
  .tag-hot { background: #FCEBEB; color: #A32D2D; }
  .tag-warm { background: #FAEEDA; color: #854F0B; }
  .tag-cold { background: var(--bg-secondary); color: var(--text-secondary); }
  .tag-cal { background: #EAF3DE; color: #3B6D11; font-size: 9px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .card-fee { font-size: 10px; font-weight: 500; color: var(--text-secondary); }
  .card-date { font-size: 10px; color: var(--text-secondary); }
  .card-initials { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 500; background: var(--bg-info); color: var(--text-info); }
  .add-card-btn { width: 100%; padding: 6px; font-size: 11px; color: var(--text-secondary); background: none; border: none; cursor: pointer; text-align: left; border-top: 0.5px solid var(--border-light); border-radius: 0 0 var(--radius-lg) var(--radius-lg); flex-shrink: 0; }
  .add-card-btn:hover { color: var(--text-primary); background: var(--bg-secondary); }
  .empty-col { font-size: 11px; color: var(--text-secondary); text-align: center; padding: 10px 0; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--bg-primary); border: 0.5px solid var(--border-mid); border-radius: var(--radius-lg); padding: 18px; width: 380px; max-width: 96vw; max-height: 88vh; overflow-y: auto; }
  .modal h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--text-primary); }
  .tabs { display: flex; margin-bottom: 14px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); overflow: hidden; }
  .tab { flex: 1; padding: 6px; font-size: 12px; text-align: center; cursor: pointer; color: var(--text-secondary); background: var(--bg-secondary); border: none; font-family: var(--font); }
  .tab.active { background: var(--bg-primary); color: var(--text-primary); font-weight: 500; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
  .field input, .field select, .field textarea { width: 100%; padding: 6px 8px; font-size: 12px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--border-mid); }
  .field textarea { resize: vertical; min-height: 50px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 14px; }
  .btn-cancel { padding: 6px 12px; font-size: 12px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); background: none; cursor: pointer; color: var(--text-secondary); font-family: var(--font); }
  .btn-save { padding: 6px 12px; font-size: 12px; font-weight: 500; border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; font-family: var(--font); }
  .btn-save:hover { background: var(--bg-secondary); }
  .btn-delete { padding: 6px 12px; font-size: 12px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); background: none; cursor: pointer; color: #A32D2D; margin-right: auto; font-family: var(--font); }
  .activity-log { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
  .activity-item { font-size: 11px; color: var(--text-secondary); padding: 5px 8px; background: var(--bg-secondary); border-radius: var(--radius-md); border-left: 2px solid var(--border-light); }
  .activity-item strong { color: var(--text-primary); font-weight: 500; }
  .add-note-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-note-row input { flex: 1; padding: 5px 8px; font-size: 12px; border: 0.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); }
  .add-note-row input:focus { outline: none; }
  .add-note-row button { padding: 5px 10px; font-size: 11px; border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); background: none; cursor: pointer; color: var(--text-primary); white-space: nowrap; font-family: var(--font); }

  /* Context menu */
  #ctx-menu { display: none; position: fixed; background: var(--bg-primary); border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); z-index: 200; min-width: 130px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  #ctx-menu.open { display: block; }
  .ctx-item { padding: 7px 12px; font-size: 12px; cursor: pointer; color: var(--text-primary); }
  .ctx-item:hover { background: var(--bg-secondary); }
  .ctx-item.danger { color: #A32D2D; }

  /* Calendly modal extras */
  #cal-log { font-size: 11px; color: var(--text-secondary); background: var(--bg-secondary); border-radius: var(--radius-md); padding: 8px; min-height: 40px; max-height: 120px; overflow-y: auto; margin-bottom: 10px; display: none; white-space: pre-wrap; font-family: monospace; }
  #sync-status { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; min-height: 16px; }
</style>
</head>
<body>

<div id="topbar">
  <span id="topbar-title">🌊 Pipeline</span>
  <input id="search-input" placeholder="Search candidates..." type="text" />
  <select id="filter-client"><option value="">All clients</option></select>
  <button class="tb-btn" id="add-btn">+ Add</button>
  <button class="tb-btn accent" id="cal-btn">↻ Calendly</button>
  <button class="tb-btn" id="export-btn">↓ CSV</button>
</div>

<div id="summary-bar">
  <div class="s-card"><div class="s-label">Total pipeline</div><div class="s-val" id="s-total">0</div></div>
  <div class="s-card"><div class="s-label">Active</div><div class="s-val" id="s-active">0</div></div>
  <div class="s-card"><div class="s-label">Placed</div><div class="s-val" id="s-placed">0</div></div>
  <div class="s-card"><div class="s-label">Projected fees</div><div class="s-val" id="s-fees">$0</div></div>
  <div class="s-card"><div class="s-label">Placed fees</div><div class="s-val" id="s-placed-fees">$0</div></div>
  <div class="s-card"><div class="s-label">Calendly synced</div><div class="s-val" id="s-cal">0</div></div>
</div>

<div id="board"></div>

<!-- Candidate modal -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Add candidate</h3>
    <div class="tabs">
      <button class="tab active" data-tab="info">Info</button>
      <button class="tab" data-tab="comp">Comp & Fees</button>
      <button class="tab" data-tab="activity">Activity</button>
    </div>
    <div class="tab-panel active" id="tab-info">
      <div class="field"><label>Name</label><input id="f-name" placeholder="First Last" /></div>
      <div class="field-row">
        <div class="field"><label>Role / Title</label><input id="f-role" placeholder="SRE" /></div>
        <div class="field"><label>Client</label><input id="f-client" placeholder="Runlayer" /></div>
      </div>
      <div class="field"><label>Email</label><input id="f-email" type="email" placeholder="candidate@email.com" /></div>
      <div class="field"><label>LinkedIn URL</label><input id="f-linkedin" placeholder="https://linkedin.com/in/..." /></div>
      <div class="field-row">
        <div class="field"><label>Priority</label>
          <select id="f-priority">
            <option value="warm">Warm</option>
            <option value="hot">Hot</option>
            <option value="cold">Cold</option>
          </select>
        </div>
        <div class="field"><label>Stage</label><select id="f-stage"></select></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Quick notes..."></textarea></div>
    </div>
    <div class="tab-panel" id="tab-comp">
      <div class="field-row">
        <div class="field"><label>Current comp ($)</label><input id="f-current-comp" type="number" placeholder="150000" /></div>
        <div class="field"><label>Target comp ($)</label><input id="f-target-comp" type="number" placeholder="180000" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Offer comp ($)</label><input id="f-offer-comp" type="number" placeholder="185000" /></div>
        <div class="field"><label>Fee %</label><input id="f-fee-pct" type="number" placeholder="20" min="0" max="100" /></div>
      </div>
      <div class="field"><label>Est. fee ($) — auto or override</label><input id="f-fee" type="number" placeholder="Auto-calculated" /></div>
      <div class="field"><label>Fee status</label>
        <select id="f-fee-status">
          <option value="projected">Projected</option>
          <option value="invoiced">Invoiced</option>
          <option value="collected">Collected</option>
        </select>
      </div>
    </div>
    <div class="tab-panel" id="tab-activity">
      <div class="activity-log" id="activity-log"></div>
      <div class="add-note-row">
        <input id="note-input" placeholder="Add a note..." />
        <button id="note-add-btn">Add note</button>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-delete" id="btn-delete" style="display:none">Delete</button>
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-save" id="btn-save">Save</button>
    </div>
  </div>
</div>

<!-- Calendly modal -->
<div class="overlay" id="cal-modal-overlay">
  <div class="modal" style="width:360px">
    <h3>Calendly sync</h3>
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5">Paste your Calendly Personal Access Token to pull recent bookings into the pipeline. Get it at calendly.com/integrations/api_webhooks</p>
    <div class="field"><label>Personal Access Token</label><input id="cal-token" type="password" placeholder="eyJ..." /></div>
    <div class="field"><label>Default stage for new bookings</label>
      <select id="cal-stage-default">
        <option value="screening">Screening</option>
        <option value="responded">Responded</option>
        <option value="sourced">Sourced</option>
      </select>
    </div>
    <div id="sync-status"></div>
    <div id="cal-log"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="cal-cancel">Cancel</button>
      <button class="btn-save" id="cal-sync-btn">Sync now</button>
    </div>
  </div>
</div>

<!-- Context menu -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">Edit</div>
  <div class="ctx-item" id="ctx-linkedin">Open LinkedIn</div>
  <div class="ctx-item" id="ctx-email">Email</div>
  <div class="ctx-item danger" id="ctx-delete">Delete</div>
</div>

<script>
const STAGES=[
  {id:'sourced',label:'Sourced',color:'#B4B2A9'},
  {id:'outreached',label:'Outreached',color:'#85B7EB'},
  {id:'responded',label:'Responded',color:'#97C459'},
  {id:'screening',label:'Screening',color:'#FAC775'},
  {id:'submitted',label:'Submitted',color:'#5DCAA5'},
  {id:'interview',label:'Interviewing',color:'#AFA9EC'},
  {id:'offer',label:'Offer',color:'#F0997B'},
  {id:'placed',label:'Placed',color:'#1D9E75'},
];

const SEED=[
  {id:'c1',name:'Marcus Webb',role:'Infra / SRE',client:'Runlayer',email:'',linkedin:'',stage:'screening',priority:'hot',notes:'Strong K8s background.',currentComp:160000,targetComp:190000,offerComp:0,feePct:20,fee:0,feeStatus:'projected',fromCal:false,date:'2025-04-10',activity:[{ts:'2025-04-10',text:'Added to pipeline'},{ts:'2025-04-11',text:'Scheduled screening call'}]},
  {id:'c2',name:'Priya Sharma',role:'Platform Engineer',client:'Runlayer',email:'',linkedin:'',stage:'outreached',priority:'warm',notes:'Ex-Stripe infra.',currentComp:175000,targetComp:200000,offerComp:0,feePct:20,fee:0,feeStatus:'projected',fromCal:false,date:'2025-04-11',activity:[{ts:'2025-04-11',text:'Sent InMail'}]},
  {id:'c3',name:'Devon Castillo',role:'Field Engineer',client:'Runlayer',email:'',linkedin:'',stage:'interview',priority:'hot',notes:'Final round next week.',currentComp:145000,targetComp:170000,offerComp:0,feePct:20,fee:0,feeStatus:'projected',fromCal:false,date:'2025-04-08',activity:[{ts:'2025-04-08',text:'Submitted to client'},{ts:'2025-04-10',text:'Passed screening'},{ts:'2025-04-13',text:'Final round scheduled'}]},
  {id:'c4',name:'Leo Huang',role:'AI Engineer',client:'OpenClaw',email:'',linkedin:'',stage:'submitted',priority:'warm',notes:'Founder loved the background.',currentComp:180000,targetComp:210000,offerComp:0,feePct:20,fee:0,feeStatus:'projected',fromCal:false,date:'2025-04-09',activity:[{ts:'2025-04-09',text:'Submitted to OpenClaw founder'}]},
  {id:'c5',name:'Nadia Flores',role:'Product Engineer',client:'Runlayer',email:'',linkedin:'',stage:'offer',priority:'hot',notes:'Offer out. $195k + equity.',currentComp:170000,targetComp:195000,offerComp:195000,feePct:20,fee:39000,feeStatus:'projected',fromCal:false,date:'2025-04-07',activity:[{ts:'2025-04-07',text:'Offer extended: $195k'}]},
];

let STATE={candidates:[]};
let dragId=null,editId=null,ctxId=null,searchVal='',filterClient='';

function load(){try{const r=localStorage.getItem('ats_full_v1');if(r)STATE=JSON.parse(r);else STATE.candidates=SEED;}catch{STATE.candidates=SEED;}}
function save(){try{localStorage.setItem('ats_full_v1',JSON.stringify(STATE));}catch{}}
function uid(){return 'c'+Date.now()+Math.random().toString(36).slice(2,5);}
function initials(n){return(n||'?').split(' ').map(p=>p[0]||'').join('').slice(0,2).toUpperCase();}
function fmt(d){if(!d)return'';const dt=new Date(d);return(dt.getMonth()+1)+'/'+dt.getDate();}
function fmtMoney(v){if(!v||isNaN(v))return'';return'$'+Math.round(v).toLocaleString();}
function calcFee(c){if(c.fee&&c.fee>0)return c.fee;const base=c.offerComp||c.targetComp||0;const pct=(c.feePct||20)/100;return Math.round(base*pct);}
function getClients(){return[...new Set(STATE.candidates.map(c=>c.client).filter(Boolean))].sort();}

function updateSummary(){
  const all=STATE.candidates;
  const active=all.filter(c=>c.stage!=='placed');
  const placed=all.filter(c=>c.stage==='placed');
  const fromCal=all.filter(c=>c.fromCal);
  const projFees=active.reduce((s,c)=>s+calcFee(c),0);
  const placedFees=placed.reduce((s,c)=>s+calcFee(c),0);
  document.getElementById('s-total').textContent=all.length;
  document.getElementById('s-active').textContent=active.length;
  document.getElementById('s-placed').textContent=placed.length;
  document.getElementById('s-fees').textContent=projFees>0?fmtMoney(projFees):'$0';
  document.getElementById('s-placed-fees').textContent=placedFees>0?fmtMoney(placedFees):'$0';
  document.getElementById('s-cal').textContent=fromCal.length;
}

function filteredFor(sid){
  return STATE.candidates.filter(c=>{
    if(c.stage!==sid)return false;
    if(filterClient&&c.client!==filterClient)return false;
    if(searchVal){const q=searchVal.toLowerCase();return(c.name||'').toLowerCase().includes(q)||(c.role||'').toLowerCase().includes(q)||(c.client||'').toLowerCase().includes(q)||(c.notes||'').toLowerCase().includes(q);}
    return true;
  });
}

function makeCard(c){
  const div=document.createElement('div');
  div.className='card';div.draggable=true;div.dataset.id=c.id;
  const priCls=c.priority==='hot'?'tag-hot':c.priority==='cold'?'tag-cold':'tag-warm';
  const priLbl=c.priority==='hot'?'Hot':c.priority==='cold'?'Cold':'Warm';
  const fee=calcFee(c);
  div.innerHTML=`
    <div class="card-top">
      <span class="card-name">${c.name||'Unnamed'}</span>
      <button class="card-menu-btn" data-id="${c.id}">···</button>
    </div>
    ${c.role?`<div class="card-role">${c.role}</div>`:''}
    <div class="card-tags">
      ${c.client?`<span class="tag tag-client">${c.client}</span>`:''}
      <span class="tag ${priCls}">${priLbl}</span>
      ${c.fromCal?`<span class="tag tag-cal">Calendly</span>`:''}
    </div>
    <div class="card-footer">
      ${fee>0?`<span class="card-fee">${fmtMoney(fee)}</span>`:`<span class="card-date">${fmt(c.date)}</span>`}
      <div class="card-initials">${initials(c.name)}</div>
    </div>`;
  div.addEventListener('dragstart',()=>{dragId=c.id;setTimeout(()=>div.classList.add('dragging'),0);});
  div.addEventListener('dragend',()=>{dragId=null;div.classList.remove('dragging');});
  div.addEventListener('dblclick',()=>openModal(c.id));
  div.querySelector('.card-menu-btn').addEventListener('click',e=>{e.stopPropagation();showCtx(c.id,e.clientX,e.clientY);});
  return div;
}

function renderBoard(){
  const board=document.getElementById('board');board.innerHTML='';
  STAGES.forEach(stage=>{
    const cards=filteredFor(stage.id);
    const col=document.createElement('div');col.className='column';
    col.innerHTML=`<div class="col-header"><div class="col-title-wrap"><div class="col-dot" style="background:${stage.color}"></div><span class="col-title">${stage.label}</span></div><span class="col-count">${cards.length}</span></div>`;
    const area=document.createElement('div');area.className='col-cards';area.dataset.stage=stage.id;
    if(!cards.length){const e=document.createElement('div');e.className='empty-col';e.textContent='Drop here';area.appendChild(e);}
    else cards.forEach(c=>area.appendChild(makeCard(c)));
    area.addEventListener('dragover',e=>{e.preventDefault();area.classList.add('drag-over');});
    area.addEventListener('dragleave',()=>area.classList.remove('drag-over'));
    area.addEventListener('drop',e=>{
      e.preventDefault();area.classList.remove('drag-over');
      if(dragId){const c=STATE.candidates.find(x=>x.id===dragId);if(c){const prev=c.stage;c.stage=stage.id;c.activity=c.activity||[];c.activity.push({ts:new Date().toISOString().slice(0,10),text:`Moved: ${STAGES.find(s=>s.id===prev)?.label} → ${stage.label}`});save();renderFilterSelect();renderBoard();updateSummary();}}
    });
    const ab=document.createElement('button');ab.className='add-card-btn';ab.textContent='+ Add';ab.addEventListener('click',()=>openModal(null,stage.id));
    col.appendChild(area);col.appendChild(ab);board.appendChild(col);
  });
  updateSummary();
}

function renderFilterSelect(){
  const sel=document.getElementById('filter-client');const cur=sel.value;
  sel.innerHTML='<option value="">All clients</option>';
  getClients().forEach(cl=>{const o=document.createElement('option');o.value=cl;o.textContent=cl;if(cl===cur)o.selected=true;sel.appendChild(o);});
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');document.getElementById('tab-'+t.dataset.tab).classList.add('active');
  });
});

function populateStageSelect(cur){
  const sel=document.getElementById('f-stage');sel.innerHTML='';
  STAGES.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.label;if(s.id===cur)o.selected=true;sel.appendChild(o);});
}

function renderActivity(c){
  const log=document.getElementById('activity-log');log.innerHTML='';
  (c.activity||[]).slice().reverse().forEach(a=>{const d=document.createElement('div');d.className='activity-item';d.innerHTML=`<strong>${a.ts}</strong> — ${a.text}`;log.appendChild(d);});
}

function openModal(id,defaultStage){
  editId=id;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i===0));
  const del=document.getElementById('btn-delete');
  if(id){
    const c=STATE.candidates.find(x=>x.id===id);
    document.getElementById('modal-title').textContent='Edit candidate';
    document.getElementById('f-name').value=c.name||'';
    document.getElementById('f-role').value=c.role||'';
    document.getElementById('f-client').value=c.client||'';
    document.getElementById('f-email').value=c.email||'';
    document.getElementById('f-linkedin').value=c.linkedin||'';
    document.getElementById('f-priority').value=c.priority||'warm';
    document.getElementById('f-notes').value=c.notes||'';
    document.getElementById('f-current-comp').value=c.currentComp||'';
    document.getElementById('f-target-comp').value=c.targetComp||'';
    document.getElementById('f-offer-comp').value=c.offerComp||'';
    document.getElementById('f-fee-pct').value=c.feePct||20;
    document.getElementById('f-fee').value=c.fee||'';
    document.getElementById('f-fee-status').value=c.feeStatus||'projected';
    populateStageSelect(c.stage);renderActivity(c);del.style.display='block';
  } else {
    document.getElementById('modal-title').textContent='Add candidate';
    ['f-name','f-role','f-client','f-email','f-linkedin','f-notes','f-current-comp','f-target-comp','f-offer-comp','f-fee'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-priority').value='warm';
    document.getElementById('f-fee-pct').value=20;
    document.getElementById('f-fee-status').value='projected';
    document.getElementById('activity-log').innerHTML='';
    populateStageSelect(defaultStage||'sourced');del.style.display='none';
  }
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('f-name').focus();
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editId=null;}

function saveModal(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return;}
  const data={name,role:document.getElementById('f-role').value.trim(),client:document.getElementById('f-client').value.trim(),email:document.getElementById('f-email').value.trim(),linkedin:document.getElementById('f-linkedin').value.trim(),priority:document.getElementById('f-priority').value,stage:document.getElementById('f-stage').value,notes:document.getElementById('f-notes').value.trim(),currentComp:parseFloat(document.getElementById('f-current-comp').value)||0,targetComp:parseFloat(document.getElementById('f-target-comp').value)||0,offerComp:parseFloat(document.getElementById('f-offer-comp').value)||0,feePct:parseFloat(document.getElementById('f-fee-pct').value)||20,fee:parseFloat(document.getElementById('f-fee').value)||0,feeStatus:document.getElementById('f-fee-status').value};
  if(editId){
    const i=STATE.candidates.findIndex(x=>x.id===editId);
    if(i>=0){const prev=STATE.candidates[i];STATE.candidates[i]={...prev,...data};if(prev.stage!==data.stage){STATE.candidates[i].activity=STATE.candidates[i].activity||[];STATE.candidates[i].activity.push({ts:new Date().toISOString().slice(0,10),text:`Stage updated to ${STAGES.find(s=>s.id===data.stage)?.label}`});}}
  } else {
    STATE.candidates.push({id:uid(),...data,fromCal:false,date:new Date().toISOString().slice(0,10),activity:[{ts:new Date().toISOString().slice(0,10),text:'Added to pipeline'}]});
  }
  save();renderFilterSelect();renderBoard();closeModal();
}

function deleteCandidate(id){STATE.candidates=STATE.candidates.filter(x=>x.id!==id);save();renderFilterSelect();renderBoard();}

document.getElementById('note-add-btn').addEventListener('click',()=>{
  const val=document.getElementById('note-input').value.trim();
  if(!val||!editId)return;
  const c=STATE.candidates.find(x=>x.id===editId);
  if(!c)return;c.activity=c.activity||[];c.activity.push({ts:new Date().toISOString().slice(0,10),text:val});
  document.getElementById('note-input').value='';save();renderActivity(c);
});

function showCtx(id,x,y){ctxId=id;const m=document.getElementById('ctx-menu');m.style.left=x+'px';m.style.top=y+'px';m.classList.add('open');}
function hideCtx(){document.getElementById('ctx-menu').classList.remove('open');ctxId=null;}
document.getElementById('ctx-edit').addEventListener('click',()=>{const id=ctxId;hideCtx();openModal(id);});
document.getElementById('ctx-linkedin').addEventListener('click',()=>{const c=STATE.candidates.find(x=>x.id===ctxId);hideCtx();if(c?.linkedin)window.open(c.linkedin,'_blank');});
document.getElementById('ctx-email').addEventListener('click',()=>{const c=STATE.candidates.find(x=>x.id===ctxId);hideCtx();if(c?.email)window.location.href='mailto:'+c.email;});
document.getElementById('ctx-delete').addEventListener('click',()=>{const id=ctxId;hideCtx();if(confirm('Delete this candidate?'))deleteCandidate(id);});
document.addEventListener('click',e=>{if(!document.getElementById('ctx-menu').contains(e.target))hideCtx();});

document.getElementById('cal-btn').addEventListener('click',()=>{
  document.getElementById('cal-token').value=localStorage.getItem('cal_token')||'';
  document.getElementById('cal-log').style.display='none';
  document.getElementById('cal-log').textContent='';
  document.getElementById('sync-status').textContent='';
  document.getElementById('cal-modal-overlay').classList.add('open');
});
document.getElementById('cal-cancel').addEventListener('click',()=>document.getElementById('cal-modal-overlay').classList.remove('open'));

document.getElementById('cal-sync-btn').addEventListener('click',async()=>{
  const token=document.getElementById('cal-token').value.trim();
  if(!token){document.getElementById('sync-status').textContent='Please enter your token.';return;}
  localStorage.setItem('cal_token',token);
  const defaultStage=document.getElementById('cal-stage-default').value;
  const statusEl=document.getElementById('sync-status');
  const logEl=document.getElementById('cal-log');
  statusEl.textContent='Connecting to Calendly...';logEl.style.display='block';logEl.textContent='';
  const btn=document.getElementById('cal-sync-btn');btn.textContent='Syncing...';btn.disabled=true;
  try {
    const meRes=await fetch('https://api.calendly.com/users/me',{headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});
    if(!meRes.ok){const e=await meRes.json();throw new Error(e.message||'Auth failed');}
    const me=await meRes.json();
    const userUri=me.resource.uri;
    logEl.textContent+='Connected as '+me.resource.name+'\n';statusEl.textContent='Fetching events...';
    const since=new Date(Date.now()-30*24*60*60*1000).toISOString();
    const evRes=await fetch(`https://api.calendly.com/scheduled_events?user=${encodeURIComponent(userUri)}&count=100&min_start_time=${since}&status=active`,{headers:{Authorization:'Bearer '+token}});
    if(!evRes.ok)throw new Error('Failed to fetch events');
    const evData=await evRes.json();
    const events=evData.collection||[];
    logEl.textContent+=`Found ${events.length} events in last 30 days\n`;
    let added=0,skipped=0;
    for(const ev of events){
      try{
        const evId=ev.uri.split('/').pop();
        const invRes=await fetch(`https://api.calendly.com/scheduled_events/${evId}/invitees?count=100`,{headers:{Authorization:'Bearer '+token}});
        if(!invRes.ok)continue;
        const invData=await invRes.json();
        for(const inv of(invData.collection||[])){
          const email=inv.email||'';const name=inv.name||email||'Unknown';
          if(!email)continue;
          const exists=STATE.candidates.find(c=>c.email&&c.email.toLowerCase()===email.toLowerCase());
          if(exists){logEl.textContent+=`Skipped (exists): ${name}\n`;skipped++;continue;}
          const evName=ev.name||'Meeting';
          const eventDate=ev.start_time?ev.start_time.split('T')[0]:new Date().toISOString().slice(0,10);
          STATE.candidates.push({id:uid(),name,email,role:'',client:'',linkedin:'',stage:defaultStage,priority:'warm',notes:`Booked: ${evName} on ${eventDate}`,currentComp:0,targetComp:0,offerComp:0,feePct:20,fee:0,feeStatus:'projected',fromCal:true,date:eventDate,activity:[{ts:eventDate,text:`Auto-imported from Calendly — ${evName}`}]});
          logEl.textContent+=`Added: ${name} (${email})\n`;added++;
        }
      }catch(invErr){
        logEl.textContent+=`Error processing event: ${invErr.message}\n`;
      }
    }
    save();renderFilterSelect();renderBoard();
    statusEl.textContent=`✓ Done — ${added} added, ${skipped} skipped`;
  } catch(err){statusEl.textContent='✗ Error: '+err.message;logEl.textContent+='\nFailed: '+err.message;}
  btn.textContent='Sync now';btn.disabled=false;
});

document.getElementById('export-btn').addEventListener('click',()=>{
  const headers=['Name','Role','Client','Email','LinkedIn','Stage','Priority','Current Comp','Target Comp','Offer Comp','Fee %','Est Fee','Fee Status','From Calendly','Date','Notes'];
  const rows=STATE.candidates.map(c=>[c.name,c.role,c.client,c.email,c.linkedin,STAGES.find(s=>s.id===c.stage)?.label||c.stage,c.priority,c.currentComp,c.targetComp,c.offerComp,c.feePct,calcFee(c),c.feeStatus,c.fromCal?'Yes':'No',c.date,c.notes].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv=[headers.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='pipeline_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
});

document.getElementById('add-btn').addEventListener('click',()=>openModal(null));
document.getElementById('btn-cancel').addEventListener('click',closeModal);
document.getElementById('btn-save').addEventListener('click',saveModal);
document.getElementById('btn-delete').addEventListener('click',()=>{if(editId){deleteCandidate(editId);closeModal();}});
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();});
document.getElementById('cal-modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('cal-modal-overlay'))document.getElementById('cal-modal-overlay').classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('cal-modal-overlay').classList.remove('open');hideCtx();}if(e.key==='Enter'&&document.getElementById('modal-overlay').classList.contains('open')&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='BUTTON')saveModal();});
document.getElementById('search-input').addEventListener('input',e=>{searchVal=e.target.value;renderBoard();});
document.getElementById('filter-client').addEventListener('change',e=>{filterClient=e.target.value;renderBoard();});

load();renderFilterSelect();renderBoard();
</script>
